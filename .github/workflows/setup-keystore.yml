name: Setup Keystore (run once)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore keystore.jks \
            -alias pinertayim \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass pinertayim2026 \
            -keypass pinertayim2026 \
            -dname "CN=Pinertayim, OU=Personal, O=Personal, L=IL, ST=IL, C=IL"

      - name: Print base64
        run: |
          echo "========================================"
          echo "START_COPY_HERE"
          echo "========================================"
          base64 -w 0 keystore.jks
          echo ""
          echo "========================================"
          echo "END_COPY_HERE"
          echo "========================================"

      - name: Upload keystore as artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: keystore-backup
          path: keystore.jks
          retention-days: 90
